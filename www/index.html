<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox Stanze</title>
<style>
:root{--bg:#eef4fd;--card:#fff;--text:#16213f;--muted:#5d6b88;--accent:#2b6fde;--fox:#f28c28;--chip:#dde8f8;--ok:#1f9d55;--warn:#c27c0e;--bad:#d23b3b;--green:#2e9b5f;color-scheme:light}
html[data-theme=dark]{--bg:#0b1020;--card:#161f36;--text:#eef4fd;--muted:#a7b5d1;--accent:#5b93f0;--chip:#232e4a;--ok:#3ccf7a;--warn:#f0b03c;--bad:#ff6b6b;--green:#3ccf7a;color-scheme:dark}
html[data-theme=dark] body{background:radial-gradient(120% 60% at 15% -10%,rgba(43,111,222,.45),transparent 60%),radial-gradient(90% 45% at 110% 0%,rgba(242,140,40,.22),transparent 60%),var(--bg)!important;background-attachment:fixed!important}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 calc(86px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:620px;margin:0 auto;padding:16px}
.brandbar{display:flex;align-items:center;gap:12px;margin:6px 2px 12px}
.brandbar .fx{width:42px;height:42px;flex:none}
.brandbar b{font-size:22px;letter-spacing:-.3px;flex:1}
.brandbar b small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ib{border:0;background:var(--chip);color:var(--text);border-radius:12px;min-width:42px;height:42px;font-size:19px;padding:0 10px}
.hero{border-radius:24px;padding:18px 18px;color:#fff;background:linear-gradient(135deg,#2b6fde,#3b3fc0 55%,#7b2fd1);position:relative;overflow:hidden;margin-bottom:12px}
.hero.or{background:linear-gradient(135deg,var(--fox),#d4600a)}
.hero.gr{background:linear-gradient(135deg,#1f9d55,#147a41)}
.hero .big{position:absolute;right:-6px;top:-14px;font-size:84px;opacity:.18;pointer-events:none}
.hero small{display:block;opacity:.85;font-size:13px}
.hero h1{font-size:24px;line-height:1.15;margin:4px 0 2px}
.hero p{font-size:14px;opacity:.95}
.stats{display:flex;gap:8px;margin-top:12px}
.stats div{flex:1;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 10px}
.stats b{display:block;font-size:19px}
.stats span{font-size:12px;opacity:.9}
h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2 span{text-transform:none;letter-spacing:0}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;background:var(--accent);color:#fff;margin-top:10px;font-weight:600}
.btn.light{background:var(--chip);color:var(--text)}
.btn.fox{background:var(--fox)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:9px;font-size:14px;margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1.5px solid var(--chip);border-radius:12px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.search{margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;border-left:6px solid var(--fox);cursor:pointer}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:17px}
.item small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .go{font-size:20px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:20}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;padding:6px 0;border-radius:12px;font-weight:600}
.tabs button i{display:block;font-style:normal;font-size:22px;margin-bottom:1px}
.tabs button.on{color:var(--accent);background:var(--chip)}
details.sec{background:var(--card);border-radius:18px;margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:9px}
details.sec[open] summary{border-bottom:1px solid var(--chip)}
details.sec .body{padding:12px 14px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid .full{grid-column:1/-1}
.unit{position:relative}
.unit input{padding-right:42px}
.unit em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin:-5px 2px 9px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:8px 2px}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--chip);border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:before{transform:translateX(22px)}
.extra{display:flex;gap:6px;margin-bottom:8px}
.extra input:first-child{flex:1.4}
.extra button{flex:none;width:42px;border:0;border-radius:12px;background:var(--chip);color:var(--bad);font-size:18px}
.addx{border:1.5px dashed var(--chip);background:none;color:var(--accent);border-radius:12px;padding:9px;width:100%;font-weight:600;font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--chip)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;right:4px;top:4px;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px}
.photos label{width:96px;height:96px;border-radius:12px;border:1.5px dashed var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:12px;cursor:pointer}
.photos label i{font-style:normal;font-size:26px}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding-top:8px;z-index:5}
.sticky .btn{margin:0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.back{border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:4px 2px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chip{border:0;background:var(--chip);color:var(--text);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--accent);color:#fff}
.stoer{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.stoer input:first-child{flex:1}
.stoer input.min{width:84px;flex:none}
.stoer button{flex:none;width:42px;height:42px;border:0;border-radius:12px;background:var(--chip);color:var(--bad);font-size:18px}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 7px;font-size:12px;margin:3px 4px 0 0;color:var(--text)}
.tag.w{background:rgba(210,59,59,.14);color:var(--bad)}
.topic h3{font-size:18px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.topic p{font-size:15px;line-height:1.5;margin-bottom:8px}
.topic ul{margin:0 0 8px 20px;font-size:15px;line-height:1.5}
.topic .note{background:rgba(242,140,40,.13);border-left:4px solid var(--fox);padding:9px 11px;border-radius:10px;font-size:14px;margin:6px 0 8px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:600;margin:6px 0 10px}
.flow span{background:var(--chip);border-radius:9px;padding:6px 9px}
.flow i{font-style:normal;color:var(--muted)}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--chip);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font-size:15px;margin-bottom:8px}
.qopt.r{border-color:var(--ok);background:rgba(31,157,85,.14)}
.qopt.f{border-color:var(--bad);background:rgba(210,59,59,.12)}
.qexp{font-size:14px;color:var(--muted);margin:4px 2px 8px;line-height:1.45}
.res{font-size:30px;font-weight:800;color:var(--accent);margin:6px 0 2px}
.small{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16213f;color:#fff;padding:11px 18px;border-radius:14px;font-size:15px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:10px}
.ctime{font-variant-numeric:tabular-nums}

.timerbar{display:flex;align-items:center;gap:10px;background:var(--fox);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.timerbar span{flex:1}.timerbar b{font-variant-numeric:tabular-nums;font-size:18px}
.timerbar button{border:0;background:#fff;color:var(--fox);border-radius:10px;padding:7px 12px;font-weight:700}
.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0}
.chg input{border-color:var(--fox)!important;background:rgba(242,140,40,.08)}
.was{font-size:12px;color:var(--fox);margin:-6px 2px 9px;font-weight:600}
.ver{padding:10px 0;border-bottom:1px solid var(--chip)}
.ver:last-child{border:0}
.ver b{font-size:14px}.ver div{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.ver button{margin-top:6px;border:0;background:var(--chip);color:var(--text);border-radius:10px;padding:6px 10px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar .l{width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{flex:1;height:18px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--fox);border-radius:6px}
.bar .v{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;margin:8px 0 2px}
.cols div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.cols div.z{background:var(--chip)}
.colsx{display:flex;gap:3px;font-size:10px;color:var(--muted)}
.colsx span{flex:1;text-align:center}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--chip);cursor:pointer}
.chk:last-child{border:0}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.chk.done .box{background:var(--green);border-color:var(--green)}
.chk.done .tx{text-decoration:line-through;color:var(--muted)}
.chk .tx{flex:1;font-size:15px;line-height:1.35}
.chk .ed{display:flex;gap:4px}
.chk .ed button{border:0;background:var(--chip);color:var(--text);border-radius:8px;width:32px;height:30px}
.prog{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--green)}
.fe{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;border-left:6px solid var(--bad);cursor:pointer}
.fe b{display:block;font-size:16px}
.fe small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.fe .lo{font-size:14px;margin-top:6px;line-height:1.4}
.ocr{position:fixed;inset:0;z-index:60;background:#05070f;color:#fff;display:flex;flex-direction:column}
.ocr .top{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#111a30}
.ocr .top small{opacity:.7;font-size:12px}
.ocr .top h3{font-size:19px;margin:2px 0 6px}
.ocr .top .vals{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ocr .top .vals span{flex:none;background:#24304f;border-radius:9px;padding:4px 8px;font-size:12px;white-space:nowrap}
.ocr .top .vals span.cur{background:var(--fox)}
.ocr .top .vals span.ok{background:#1f6b42}
.ocr .pic{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.ocr .pic .inner{position:relative;width:100%}
.ocr .pic img{width:100%;display:block}
.ocr .hit{position:absolute;border:2px solid #36d07c;background:rgba(54,208,124,.18);border-radius:5px;padding:0}
.ocr .hit.used{border-color:var(--fox);background:rgba(242,140,40,.3)}
.ocr .bot{display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#111a30}
.ocr .bot button{flex:1;border:0;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:600;background:#24304f;color:#fff}
.ocr .bot button.go{background:var(--accent)}
.ocrbtns{display:flex;gap:8px;margin:0 0 10px}
.ocrbtns label{flex:1;text-align:center;margin:0}
.qrbox{background:#fff;border-radius:14px;padding:14px;text-align:center;color:#000}
.qrbox svg{width:220px;height:220px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <svg class="fx" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 6 L15 15 L25 15 L34 6 L33 22 Q30 33 20 35 Q10 33 7 22 Z" fill="#f28c28"/><path d="M12 22 Q20 33 28 22 Q24 29 20 29 Q16 29 12 22 Z" fill="#fff4e8"/><rect x="7" y="17" width="26" height="2" rx="1" fill="#5a3416"/><circle cx="15" cy="19" r="3.4" fill="#5a3416"/><circle cx="25" cy="19" r="3.4" fill="#5a3416"/><circle cx="15" cy="19" r="2.4" fill="#9fdcff"/><circle cx="25" cy="19" r="2.4" fill="#9fdcff"/><circle cx="20" cy="28" r="1.6" fill="#2a1640"/></svg>
    <b>Fox Stanze<small>Göpfert Flachbettstanze · Rüsten &amp; Schicht</small></b>
    <button class="ib" id="btnTheme" title="Hell/Dunkel">🌙</button>
    <button class="ib" id="btnMenu" title="Sichern &amp; Export">⋯</button>
  </div>
  <div id="timerbar"></div>
  <main id="view"></main>
</div>
<nav class="tabs">
  <button data-tab="ruesten" class="on"><i>🧰</i>Rüsten</button>
  <button data-tab="schicht"><i>📋</i>Schicht</button>
  <button data-tab="wissen"><i>📖</i>Wissen</button>
  <button data-tab="rechner"><i>🧮</i>Rechner</button>
</nav>
<script src="version.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
